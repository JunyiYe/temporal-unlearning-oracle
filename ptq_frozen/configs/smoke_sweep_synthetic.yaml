# Fast end-to-end smoke config for scripts/run_sweep.py (synthetic panel).
# Split dates here are placeholders — run_sweep.py overrides them per fold.
seed: 7

data:
  kind: csv_panel
  path: data/synthetic_returns.csv
  date_col: date
  asset_col: symbol
  value_col: return
  min_history: 500
  train_end: "2020-12-31"
  val_end: "2021-12-31"
  test_end: "2022-12-31"

task:
  context_length: 64
  horizon: 1
  forward_period: 5
  target: realized_vol_fwd5d
  target_agg: realized_vol
  target_log: true
  normalize: zscore
  target_transform: cross_sectional_zscore
  target_clip: "-3,3"
  feature_columns:
    - value
    - ret_ma5
    - ret_ma10
    - ret_ma20
    - vol_20
    - rsi_14
    - macd
    - macd_signal
    - max_20
    - min_20
    - skew_20

model:
  name: dlinear
  moving_avg: 25

train:
  batch_size: 256
  epochs: 2
  lr: 0.0005
  weight_decay: 0.01
  patience: 2
  log_every: 1
  device: auto

ptq:
  enabled: true
  methods:
    - fp32
    - dynamic_int8
    - static_int8
    - static_int4
    - rtn_w4
  calibration:
    policies:
      - random
      - recent
      - volatility_stratified
    num_windows: 256
    volatility_window: 20

evaluation:
  portfolio:
    enabled: false
  regimes:
    volatility_deciles: 10
